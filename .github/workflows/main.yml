name: Build Come Live Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -o ComeLiveAnalyzerB_source.zip -d android-project
          echo "Extracted files:"
          find android-project -maxdepth 4 -type f

      - name: Find project root
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle -type f | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ComeLiveAnalyzerB-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
